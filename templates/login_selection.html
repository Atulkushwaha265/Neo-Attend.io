<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NeoAttend - College Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global-style.css') }}">

    <style>
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .selection-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .selection-card:hover {
            transform: translateY(-5px);
        }

        .selection-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .selection-header h1 {
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .selection-header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .logo-container img {
            height: 60px;
            margin-bottom: 15px;
        }

        .btn-role {
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s ease;
            margin-bottom: 15px;
            border: none;
        }

        .btn-role:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .btn-admin {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
        }

        .btn-teacher {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .btn-student {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .card-body {
            padding: 30px;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #6c757d;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="main-container">
    <div class="selection-card">

        <div class="selection-header">

            <!-- College Logo -->
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="College Logo">
            </div>

            <h1>NeoAttend</h1>
            <p>Welcome to College Portal</p>
        </div>

        <div class="card-body">

            <a href="{{ url_for('admin.admin_login') }}" class="d-block mb-3">
                <button class="btn btn-role btn-admin w-100">
                    <i class="fas fa-user-shield me-2"></i>Admin Login
                </button>
            </a>

            <a href="{{ url_for('teacher.login') }}" class="d-block mb-3">
                <button class="btn btn-role btn-teacher w-100">
                    <i class="fas fa-chalkboard-teacher me-2"></i>Teacher Login
                </button>
            </a>

            <a href="{{ url_for('student.student_portal') }}" class="d-block mb-3">
                <button class="btn btn-role btn-student w-100">
                    <i class="fas fa-user-graduate me-2"></i>Student Portal
                </button>
            </a>

            <div class="register-link">
                New teacher?
                <a href="{{ url_for('teacher.register') }}">Register here</a>
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

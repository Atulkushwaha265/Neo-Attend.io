<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login | NeoAttend</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Global Background CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global-style.css') }}">

    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .login-logo-container img {
            height: 55px;
            margin-bottom: 10px;
        }

        .login-header h3 {
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .card-body {
            padding: 30px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 12px 14px;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.15);
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f8f9fa;
            border: 1px solid #ddd;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(102,126,234,0.35);
        }

        .btn-outline-primary {
            border-radius: 10px;
            padding: 12px;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.15);
            padding: 8px 18px;
            border-radius: 20px;
            transition: 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.25);
            transform: translateX(-3px);
            color: white;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>

<body>

<a href="/student" class="back-link">
    <i class="fas fa-arrow-left me-1"></i>Back to Portal
</a>

<div class="login-container">
    <div class="login-card">

        <div class="login-header">
            <div class="login-logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="College Logo">
            </div>
            <h3>Student Login</h3>
            <p>Access your academic portal</p>
        </div>

        <div class="card-body">

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/student/login">

                <div class="mb-3">
                    <label class="form-label">College Email or Roll Number</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user-graduate"></i>
                        </span>
                        <input type="text" name="identifier" class="form-control"
                               placeholder="Enter college email or roll number" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control"
                               placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 mb-3">
                    <i class="fas fa-sign-in-alt me-1"></i>Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <a href="/student/register" class="btn btn-outline-primary w-100 mb-2">
                <i class="fas fa-user-plus me-1"></i>Create Account
            </a>

            <div class="text-center mt-2">
                <a href="/attendance" class="text-decoration-none text-muted">
                    <i class="fas fa-camera me-1"></i>Quick Attendance
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
